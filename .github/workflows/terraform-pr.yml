name: Terraform Pull Request Checks 

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-pr.yml"
permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format, Validate, and Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Format Check
        run: terraform fmt -check
      - name: Terraform Validate
        run: terraform validate
      # Plan requires an authenticated Entra tenant. Keep untrusted PR checks
      # credential-free; run plans locally or through an approved environment.
